<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Multi-Scene VR Tour Exercise #1</title>
    <!-- 1. Load A-Frame FIRST -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- 2. Load custom script SECOND -->
    <script src="main.js"></script>
  </head>
  <body>
    <a-scene id="main-scene" background="color: #1A0033">

      <!-- Camera with Mouse Click Support -->
      <a-entity id="rig" position="0 0 0">
        <a-camera look-controls raycaster="objects: .clickable">
          <a-cursor 
            id="cursor" 
            cursor="rayOrigin: mouse" 
            raycaster="objects: .clickable"
            material="color: #00FFBB; shader: flat" 
            position="0 0 -1" 
            geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025">
          </a-cursor>
        </a-camera>
      </a-entity>

      <!-- GROUND PLANE -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#808080"></a-plane>

      <!-- LIGHTS -->
      <a-light type="ambient" color="#FFF"></a-light>
      <a-light type="directional" position="-1 2 1" color="#FFF" intensity="0.8"></a-light>


      <!-- ================= SCENE 1: CYBERPUNK CITY ================= -->
      <a-entity id="scene1" visible="true">
        <!-- Cyberpunk City (generated in main.js) -->
        <a-entity cyberpunk-city></a-entity>

       

        <!-- Info Panel with Embedded Picture -->
        <a-entity position="0 1.6 -3">
          <!-- Background Panel (Wider to accommodate image) -->
          <a-plane width="3.6" height="1.8" color="#0F0F1A" opacity="0.9" material="shader: flat"></a-plane>

          <!-- Panel Title -->
          <a-text value="Scene 1: Cyberpunk City" align="center" position="0 0.65 0.01" width="4" color="#00FFBB"></a-text>

          <!-- Contextual Text (Positioned on the Right) -->
          <a-text value="Welcome to the main hub.\n\nYou are located in a vibrant city with flying cars. \n\nClick the portal to\nteleport to Scene 2." 
                  align="center" position="0.0 -0.1 0.01" width="2.4" color="#FFFFFF"></a-text>
        </a-entity>

        <!-- Portal to Scene 2 -->
        <a-entity position="2.5 1.2 -3">
          <a-torus class="portal-element clickable" radius="0.6" radius-tubular="0.03" color="#00E5FF" 
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
                   onclick="goToScene('scene2')"></a-torus>
          <a-circle class="portal-element clickable" radius="0.55" color="#FF007F" opacity="0.8" 
                    material="shader: flat; side: double"
                    onclick="goToScene('scene2')"></a-circle>
          <a-text value="Go to Scene 2" align="center" position="0 -0.9 0" width="3" color="#000000"></a-text>
        </a-entity>
      </a-entity>


      <!-- ================= SCENE 2: SUNSET PLAZA ================= -->
      <a-entity id="scene2" visible="false">
         <!-- Neon Ocean with animated waves -->
        <a-entity neon-ocean position="0 0.05 -18"></a-entity>
        <!-- Decorative Pillars -->
        <!--<a-cylinder position="-5 4 -10" radius="0.8" height="8" color="#737071"></a-cylinder>
        <a-cylinder position="5 4 -10" radius="0.8" height="8" color="#737071"></a-cylinder>

        <!- Info Panel -->
        <a-entity position="0 1.6 -3">
          <a-plane width="3" height="1.4" color="#2A1B0E" opacity="0.9" material="shader: flat"></a-plane>
          <a-text value="Scene 2: Sunset Plaza" align="center" position="0 0.4 0.01" width="4" color="#FF9900"></a-text>
          <a-text value="You have entered the beach.\nUse the portals to navigate forward or back." align="center" position="0 -0.1 0.01" width="2.6" color="#FFFFFF"></a-text>
        </a-entity>

        <!-- Portal to Scene 3 -->
        <a-entity position="2.5 1.2 -3">
          <a-torus class="portal-element" radius="0.6" radius-tubular="0.03" color="#FF9900" 
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
                   onclick="goToScene('scene3')"></a-torus>
          <a-circle class="portal-element" radius="0.55" color="#00FFBB" opacity="0.8" 
                    material="shader: flat; side: double"
                    onclick="goToScene('scene3')"></a-circle>
          <a-text value="Go to Scene 3" align="center" position="0 -0.9 0" width="3" color="#000000"></a-text>
        </a-entity>

        <!-- Return Portal to Scene 1 -->
        <a-entity position="-2.5 1.2 -3">
          <a-torus class="portal-element" radius="0.6" radius-tubular="0.03" color="#AAAAAA" 
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
                   onclick="goToScene('scene1')"></a-torus>
          <a-circle class="portal-element" radius="0.55" color="#555555" opacity="0.8" 
                    material="shader: flat; side: double"
                    onclick="goToScene('scene1')"></a-circle>
          <a-text value="Back to Scene 1" align="center" position="0 -0.9 0" width="3" color="#000000"></a-text>
        </a-entity>
      </a-entity>


      <!-- ================= SCENE 3: MATRIX GRID ================= -->
      <a-entity id="scene3" visible="false">
        <!-- Floating Spheres -->
        <a-sphere position="0 3 -8" radius="1.5" color="#00FF66" wireframe="true"
                  animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"></a-sphere>

        <!-- Info Panel -->
        <a-entity position="0 1.6 -3">
          <a-plane width="3" height="1.4" color="#051A05" opacity="0.9" material="shader: flat"></a-plane>
          <a-text value="Scene 3: Matrix Grid" align="center" position="0 0.4 0.01" width="4" color="#00FF66"></a-text>
          <a-text value="Final scene reached.\nClick below to return to the start." align="center" position="0 -0.1 0.01" width="2.6" color="#FFFFFF"></a-text>
        </a-entity>

         <!-- Portal to Scene 2 -->
        <a-entity position="2.5 1.2 -3">
          <a-torus class="portal-element" radius="0.6" radius-tubular="0.03" color="#FF9900" 
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
                   onclick="goToScene('scene2')"></a-torus>
          <a-circle class="portal-element" radius="0.55" color="#00FFBB" opacity="0.8" 
                    material="shader: flat; side: double"
                    onclick="goToScene('scene2')"></a-circle>
          <a-text value="Return to Scene 2" align="center" position="0 -0.9 0" width="3" color="#000000"></a-text>
        </a-entity>

        <!-- Return Portal to Scene 1 -->
        <a-entity position="-2.5 1.2 -3">
          <a-torus class="portal-element" radius="0.6" radius-tubular="0.03" color="#AAAAAA" 
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
                   onclick="goToScene('scene1')"></a-torus>
          <a-circle class="portal-element" radius="0.55" color="#555555" opacity="0.8" 
                    material="shader: flat; side: double"
                    onclick="goToScene('scene1')"></a-circle>
          <a-text value="Back to Scene 1" align="center" position="0 -0.9 0" width="3" color="#000000"></a-text>
        </a-entity>

       
      </a-entity>

    </a-scene>
  </body>
</html>
